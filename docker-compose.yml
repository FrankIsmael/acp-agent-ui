services:
  app:
    # Built by .github/workflows/deploy.yml. deploy/oracle/deploy.sh pins the
    # running digest in docker-compose.override.yml (loaded by Compose on its
    # own), so a manual `up` keeps that image rather than whatever :main is now.
    image: ghcr.io/frankismael/acp-agent-ui:main
    env_file: .env
    restart: unless-stopped
    # Runs as `node` (uid 1000, set in the Dockerfile); it needs no capabilities.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      # WhatsApp pairing credentials and the current SQLite stores survive rebuilds.
      - ./.data:/app/.data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      # deploy-hook.py's socket, for POST /_deploy (acp-deploy-hook.service).
      - /run/acp-deploy:/run/acp-deploy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

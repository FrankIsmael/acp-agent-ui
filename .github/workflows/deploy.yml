name: Deploy to Oracle VM

# Builds the arm64 image here and publishes it as ghcr.io/frankismael/acp-agent-ui:main,
# then calls POST /_deploy on the VM, which pulls it (deploy/oracle/deploy-hook.py)
# and answers with the result. The VM never builds.
# Setup: docs/oracle-deployment.md ("Automatic deploys").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer push supersedes a run still in progress, so :main never moves back
# to an older commit.
concurrency:
  group: deploy-oracle
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/frankismael/acp-agent-ui

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Runs alongside typecheck. The image build includes `npm run build`, so a
  # commit that does not build fails here.
  image:
    # Forks and the upstream repo have no VM to deploy to. Only main ships:
    # a manual run started on another branch must not move :main.
    if: github.repository == 'FrankIsmael/acp-agent-ui' && github.ref == 'refs/heads/main'
    # The VM is VM.Standard.A1.Flex (arm64): build natively, no QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          # One plain manifest, so the digest the VM pins is the image itself.
          provenance: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          # deploy.sh reads the revision to move the VM's checkout to the same commit.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # :main only moves once both checks passed. Retagging copies no layers.
  # Then the VM deploys it and this job shows how that went.
  release:
    needs: [typecheck, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:sha-$GITHUB_SHA"
      - name: Deploy on the VM
        env:
          # Repository variable: https://<APP_DOMAIN>/_deploy
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # X-Revision makes the VM fail rather than report another commit as deployed.
          status=$(curl -sS -o deploy.log -w '%{http_code}' --max-time 1300 -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" -H "X-Revision: $GITHUB_SHA" \
            "$DEPLOY_URL") || true
          cat deploy.log 2>/dev/null || true
          if [ "$status" != 200 ]; then
            echo "::error::deploy failed (HTTP ${status:-no response}); see the output above, or journalctl -u acp-deploy-hook on the VM"
            exit 1
          fi
